server:
  port: ${PORT:8080}

spring:
  application:
    name: ${SPRING_APP_NAME:LiveInterview}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:3}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}

  sql:
    init:
      platform: ${SQL_PLATFORM:postgres}

livekit:
  url: ${LIVEKIT_URL}
  api:
    key: ${LIVEKIT_API_KEY}
    secret: ${LIVEKIT_API_SECRET}
  token:
    ttl: ${LIVEKIT_TOKEN_TTL:7200}

internal:
  service:
    api-key: ${INTERNAL_SERVICE_API_KEY}

resume:
  normalization:
    service:
      url: ${RESUME_NORMALIZATION_SERVICE_URL:http://localhost:8000}

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME:Admin}

ai:
  interview:
    allow-server-key-fallback: ${AI_INTERVIEW_ALLOW_SERVER_KEY_FALLBACK:false}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads/resumes}

debug: true
